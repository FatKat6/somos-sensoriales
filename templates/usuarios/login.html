{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-1">Somos Sensoriales</h1>
        <p class="text-center text-muted mb-4">Reserva de horas</p>
        <form method="post" novalidate>
          {% csrf_token %}
          {% for campo in form %}
            <div class="mb-3">
              <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
              {{ campo }}
            </div>
          {% endfor %}
          <button class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="{% url 'usuarios:registro' %}">Regístrate</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
